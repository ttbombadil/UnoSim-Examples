schemaVersion: 1
id: long-values
title: Long-Werte im Sketch
locale: de-DE
activation:
  any:
    - fact: type-used
      values: [long]
concepts:
  - id: long-value-meaning
    title: Long-Werte
    objective: Die Rolle eines long-Werts im aktuellen Sketch erklären.
    prerequisites: []
    difficulty:
      entry: [1, 50]
      transfer: [20, 80]
    misconceptions:
      - id: long-unbounded
        description: Ein long-Wert ist für jede beliebige Größe automatisch ausreichend.
    indicators:
      - id: identifies-long-value
        description: Beschreibt, welche Größe oder Messinformation im long-Wert gespeichert wird.
    mastery:
      minimumSuccessfulProbes: 1
      successRatingAtLeast: 3
      requiredIndicators: [identifies-long-value]
      minimumDistinctQuestionKinds: 1
      recentWeakAnswersAllowed: 0
  - id: long-value-usage
    title: Verwendung eines Long-Werts
    objective: Die Verwendung eines long-Werts als Mess- oder Zustandsinformation einordnen.
    prerequisites: [long-value-meaning]
    difficulty:
      entry: [1, 50]
      transfer: [20, 80]
    misconceptions:
      - id: long-same-as-int
        description: Ein langer Ganzzahltyp hat denselben Wertebereich wie int.
    indicators:
      - id: explains-long-usage
        description: Erklärt, warum der long-Wert zur dargestellten Information passt.
    mastery:
      minimumSuccessfulProbes: 1
      successRatingAtLeast: 3
      requiredIndicators: [explains-long-usage]
      minimumDistinctQuestionKinds: 1
      recentWeakAnswersAllowed: 0
questions:
  - id: long-value-concept
    concept: long-value-meaning
    indicator: identifies-long-value
    kind: concept
    difficulty: [1, 50]
    requires:
      - fact: type-used
        values: [long]
    text: Welche Information speichert eine Variable vom Typ long oder unsigned long im aktuellen Sketch, und wie heißt sie?
  - id: long-value-application
    concept: long-value-usage
    indicator: explains-long-usage
    kind: application
    difficulty: [20, 80]
    requires:
      - fact: type-used
        values: [long]
    text: "Nenne eine long-Variable aus dem aktuellen Sketch: Warum reicht für ihre Werte der Datentyp int nicht aus?"
  - id: long-value-prediction
    concept: long-value-meaning
    indicator: identifies-long-value
    kind: prediction
    difficulty: [20, 80]
    requires:
      - fact: type-used
        values: [long]
    text: "Wähle eine Variable mit langem Ganzzahltyp, die sich in loop() ändert: Welchen Verlauf erwartest du für ihren Wert über mehrere Durchläufe?"
  - id: long-value-transfer
    concept: long-value-usage
    indicator: explains-long-usage
    kind: transfer
    difficulty: [20, 80]
    requires:
      - fact: type-used
        values: [long]
    text: Welche weitere zeitbezogene Information könntest du im aktuellen Sketch mit demselben Datentyp erfassen, ohne den vollständigen Code zu entwerfen?
scaffolds:
  - id: long-value-scaffold
    forConcept: long-value-usage
    strategy: smaller-subproblem
    level: 1
    hint: Benenne zuerst die Information, die der long-Wert im aktuellen Sketch repräsentiert.
    nextQuestion: long-value-application
progression:
  entryConcepts: [long-value-meaning]
  preferredOrder: [long-value-meaning, long-value-usage]
  onRating:
    1-2: remediate
    3: clarify-same-indicator
    4: probe-missing-indicator
    5: evaluate-mastery-and-advance
